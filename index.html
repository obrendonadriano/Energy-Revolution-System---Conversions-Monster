<script>
(function () {
    var BASE = "https://e0739nfdrkgiwqcdtcri0w8zb4.hop.clickbank.net";
    var CLICK_ANYWHERE = true;
    var IGNORE = "";

    // Repassa os parâmetros da URL atual (utm_source, click_id...) para o link final
    function finalUrl() {
        var q = window.location.search.replace(/^\?/, '');
        if (!q) return BASE;
        return BASE + (BASE.indexOf('?') !== -1 ? '&' : '?') + q;
    }

    var fired = false;
    function go(e) {
        if (e && e.preventDefault) e.preventDefault();
        if (fired) return false;
        fired = true;
        var url = finalUrl();
        setTimeout(function () {
            var a = document.createElement('a');
            a.href = url; a.target = '_self'; a.rel = 'nofollow noopener';
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(function () { window.location.href = url; }, 400);
        }, 150);
        return false;
    }

    function start() {
        var popup = document.getElementById('wl-popup');
        if (!popup) return;

        var links = popup.querySelectorAll('.wl-link');
        for (var i = 0; i < links.length; i++) links[i].addEventListener('click', go);


        if (CLICK_ANYWHERE) {
            popup.addEventListener('click', function (e) {
                if (IGNORE && e.target.closest && e.target.closest(IGNORE)) return;
                go(e);
            });
        }

        popup.style.display = 'flex';
        setTimeout(function () { popup.classList.add('wl-visible'); }, 20);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start);
    } else {
        start();
    }
})();
